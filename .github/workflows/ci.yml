name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Render all scenes
        run: cmake -E env ${{ runner.os == 'Windows' && 'build/bin/Release/sr_render.exe' || 'build/bin/sr_render' }} --scene all --width 960 --height 540

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ matrix.os }}
          path: renders/
          if-no-files-found: ignore
